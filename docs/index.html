<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prontuários</title>
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="view active" id="view-canvas">
  <header class="topbar">
    <div class="canvas-title">Prontuário</div>
    <button id="btn-canvas-menu" class="icon-btn" title="Descartar alterações não salvas">⋮</button>
  </header>

  <div class="toolbar" id="toolbar">
    <button class="tool-btn active" data-tool="pen" title="Caneta">🖊️</button>
    <button class="tool-btn" data-tool="eraser" title="Borracha">🧹</button>
    <input type="color" id="pen-color" value="#1b1b1b" title="Cor">
    <select id="pen-width" title="Espessura">
      <option value="1.5">Fino</option>
      <option value="3" selected>Médio</option>
      <option value="6">Grosso</option>
    </select>
    <button id="btn-undo" class="tool-btn" title="Desfazer">↶</button>
    <button id="btn-redo" class="tool-btn" title="Refazer">↷</button>
    <button id="btn-reset-zoom" class="tool-btn" title="Voltar zoom ao normal">⤢</button>
    <span class="spacer"></span>
    <div id="page-indicator" class="page-indicator">1 / 2</div>
  </div>

  <div class="canvas-scroll" id="canvas-scroll">
    <div class="page-stage" id="page-stage-1" data-page="1">
      <img class="page-bg" src="assets/template/page-1.png" draggable="false">
      <canvas class="draw-layer" id="draw-canvas-1"></canvas>
    </div>
    <div class="page-stage" id="page-stage-2" data-page="2">
      <img class="page-bg" src="assets/template/page-2.png" draggable="false">
      <canvas class="draw-layer" id="draw-canvas-2"></canvas>
    </div>
  </div>

  <div class="bottom-actions">
    <button id="btn-save" class="btn-secondary">Salvar</button>
    <button id="btn-export-pdf" class="btn-primary">Exportar PDF</button>
  </div>
</div>

<!-- ===================== MODAL genérico ===================== -->
<div id="modal-backdrop" class="modal-backdrop">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="js/db.js"></script>
<script src="js/canvas-engine.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
